<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>White Noise Sounds — Installed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:    #A8C5E2;
      --bg:        #fafaf7;
      --bg-2:      #f1efe9;
      --fg:        #2b2b2b;
      --muted:     #888;
      --line:      #d6d3cd;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .brand img {
      width: 36px;
      height: 36px;
    }
    .brand-name {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
    }

    /* Title */
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .subtitle {
      font-size: 18px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 56px;
    }

    /* Steps */
    .instruction {
      font-size: 17px;
      line-height: 1.6;
      text-align: center;
      max-width: 580px;
      margin: 0 auto 28px;
    }
    .instruction b { font-weight: 600; }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--fg);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 56px;
    }
    .image-wrapper svg {
      width: 100%;
      max-width: 700px;
      height: auto;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }

    .sep {
      border: none;
      border-top: 1.5px solid var(--fg);
      margin: 0 0 56px;
    }

    @media (max-width: 480px) {
      main { padding: 36px 16px 56px; }
      h1   { margin-bottom: 10px; }
      .subtitle { margin-bottom: 40px; }
      .image-wrapper { margin-bottom: 40px; }
    }
  </style>
</head>
<body>
<main>

  <div class="brand">
    <img src="icon128.png" alt="White Noise Sounds" />
    <span class="brand-name">White Noise Sounds</span>
  </div>

  <h1>You're all set!</h1>
  <p class="subtitle">Just two quick steps to pin the extension.</p>

  <!-- Step 1 -->
  <p class="instruction">
    Click the puzzle piece <span class="step-num">1</span> in the top-right corner of Chrome,
    then click the <b>pin icon</b> <span class="step-num">2</span> next to White Noise Sounds:
  </p>

  <div class="image-wrapper">
    <!-- Browser mockup: step 1 — pin the extension -->
    <svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step 1: pin the extension">
      <defs>
        <filter id="s1">
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000018"/>
        </filter>
        <clipPath id="win-clip">
          <rect width="700" height="440" rx="12"/>
        </clipPath>
      </defs>

      <!-- Window -->
      <rect width="700" height="440" rx="12" fill="#e8eaed"/>

      <!-- Tab bar -->
      <rect y="0" width="700" height="38" rx="12" fill="#dee1e6"/>
      <rect y="20" width="700" height="18" fill="#dee1e6"/>

      <!-- Active tab -->
      <rect x="10" y="7" width="170" height="26" rx="6" fill="#f8f9fa"/>
      <circle cx="168" cy="20" r="5" fill="none"/>
      <text x="85" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#444">New Tab</text>
      <text x="168" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">✕</text>
      <text x="194" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#888">+</text>

      <!-- Nav bar -->
      <rect y="38" width="700" height="42" fill="#f8f9fa"/>
      <rect x="1" y="79" width="698" height="1" fill="#dadce0"/>

      <!-- Back / fwd / refresh -->
      <text x="22" y="65" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#aaa">‹</text>
      <text x="45" y="65" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ccc">›</text>
      <text x="68" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#aaa">↻</text>

      <!-- Address bar -->
      <rect x="88" y="48" width="468" height="24" rx="12" fill="white" stroke="#dadce0" stroke-width="1"/>
      <text x="322" y="64" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#bbb">www.google.com</text>

      <!-- Toolbar icons: bookmark / screenshot / extensions / profile / menu -->
      <text x="574" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5f6368">☆</text>

      <!-- Puzzle piece icon (target of circle 1) -->
      <g transform="translate(624,48)">
        <rect width="22" height="22" rx="4" fill="none"/>
        <!-- simplified puzzle shape -->
        <path d="M4 8 h4 v-2 a2 2 0 0 1 4 0 v2 h4 v4 h2 a2 2 0 0 1 0 4 h-2 v4 H4 v-4 H2 a2 2 0 0 1 0-4 h2 Z"
              fill="#5f6368" fill-rule="evenodd"/>
      </g>

      <circle cx="660" cy="59" r="11" fill="#e8eaed" stroke="#dadce0" stroke-width="1"/>
      <circle cx="660" cy="56" r="4" fill="#9aa0a6"/>
      <path d="M650 69 Q651 63 660 63 Q669 63 670 69" fill="#9aa0a6"/>
      <text x="682" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5f6368">⋮</text>

      <!-- Content area -->
      <rect y="80" width="700" height="360" fill="white"/>

      <!-- Google logo placeholder -->
      <text x="350" y="220" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="700" fill="#e0e0e0">Google</text>
      <rect x="220" y="240" width="260" height="32" rx="16" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

      <!-- Extensions dropdown panel -->
      <rect x="438" y="82" width="220" height="148" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1" filter="url(#s1)"/>

      <text x="460" y="104" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#202124">Extensions</text>
      <text x="645" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">✕</text>
      <line x1="440" y1="113" x2="656" y2="113" stroke="#f0f0f0" stroke-width="1"/>

      <text x="460" y="130" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#202124">No access needed</text>
      <text x="460" y="143" font-family="Inter,sans-serif" font-size="9" fill="#777">These extensions don't need to see</text>
      <text x="460" y="154" font-family="Inter,sans-serif" font-size="9" fill="#777">and change info on this site.</text>

      <!-- Extension row -->
      <rect x="444" y="160" width="208" height="36" rx="6" fill="#f8f9fa"/>

      <!-- WNS icon in list (16×16) -->
      <image href="icon128.png" x="456" y="170" width="16" height="16"/>

      <text x="481" y="180" font-family="Inter,sans-serif" font-size="11" fill="#202124" font-weight="500">White Noise Sounds</text>

      <!-- Pin button -->
      <circle cx="636" cy="178" r="13" fill="white" stroke="#dadce0" stroke-width="1"/>
      <image href="pin.png" x="623" y="166" width="26" height="26"/>

      <text x="460" y="216" font-family="Inter,sans-serif" font-size="10" fill="#5f6368">⚙ Manage Extensions</text>

      <!-- ── Circle 1 around puzzle piece ── -->
      <circle cx="635" cy="59" r="20" fill="#e5393520" stroke="#e53935" stroke-width="2.5"/>
      <!-- Number badge 1 -->
      <circle cx="555" cy="18" r="11" fill="#e53935"/>
      <text x="555" y="22.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="white">1</text>
      <!-- Arrow from badge to circle -->
      <path d="M566 20 L617 42" stroke="#e53935" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

      <!-- ── Circle 2 around pin button ── -->
      <circle cx="636" cy="178" r="18" fill="#e5393520" stroke="#e53935" stroke-width="2.5"/>
      <!-- Number badge 2 -->
      <circle cx="530" cy="290" r="11" fill="#e53935"/>
      <text x="530" y="294.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="white">2</text>
      <!-- Arrow from badge to circle -->
      <path d="M534 279 L629 195" stroke="#e53935" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

      <defs>
        <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#e53935"/>
        </marker>
      </defs>
    </svg>
  </div>

  <hr class="sep" />

  <!-- Step 2 -->
  <p class="instruction">
    Now click the extension icon <span class="step-num">3</span> in the toolbar
    to open <b>White Noise Sounds</b> on any page:
  </p>

  <div class="image-wrapper">
    <!-- Browser mockup: step 2 — click pinned icon -->
    <svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step 2: open the extension">
      <defs>
        <filter id="s2">
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000018"/>
        </filter>
      </defs>

      <!-- Window -->
      <rect width="700" height="440" rx="12" fill="#e8eaed"/>

      <!-- Tab bar -->
      <rect y="0" width="700" height="38" rx="12" fill="#dee1e6"/>
      <rect y="20" width="700" height="18" fill="#dee1e6"/>
      <rect x="10" y="7" width="170" height="26" rx="6" fill="#f8f9fa"/>
      <text x="85" y="24" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#444">New Tab</text>
      <text x="168" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">✕</text>
      <text x="194" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#888">+</text>

      <!-- Nav bar -->
      <rect y="38" width="700" height="42" fill="#f8f9fa"/>
      <rect x="1" y="79" width="698" height="1" fill="#dadce0"/>

      <text x="22" y="65" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#aaa">‹</text>
      <text x="45" y="65" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ccc">›</text>
      <text x="68" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#aaa">↻</text>
      <rect x="88" y="48" width="468" height="24" rx="12" fill="white" stroke="#dadce0" stroke-width="1"/>
      <text x="322" y="64" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#bbb">www.google.com</text>

      <text x="574" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5f6368">☆</text>

      <!-- WNS icon pinned in toolbar -->
      <image href="icon128.png" x="601" y="50" width="18" height="18"/>

      <!-- Puzzle piece icon -->
      <g transform="translate(640,48)">
        <rect width="22" height="22" rx="4" fill="none"/>
        <path d="M4 8 h4 v-2 a2 2 0 0 1 4 0 v2 h4 v4 h2 a2 2 0 0 1 0 4 h-2 v4 H4 v-4 H2 a2 2 0 0 1 0-4 h2 Z"
              fill="#5f6368" fill-rule="evenodd"/>
      </g>
      <circle cx="676" cy="59" r="11" fill="#e8eaed" stroke="#dadce0" stroke-width="1"/>
      <circle cx="676" cy="56" r="4" fill="#9aa0a6"/>
      <path d="M666 69 Q667 63 676 63 Q685 63 686 69" fill="#9aa0a6"/>
      <text x="692" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5f6368">⋮</text>

      <!-- Content area -->
      <rect y="80" width="700" height="360" fill="white"/>
      <text x="350" y="220" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="700" fill="#e0e0e0">Google</text>
      <rect x="220" y="240" width="260" height="32" rx="16" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>

      <!-- ── Circle 3 around WNS icon ── -->
      <circle cx="610" cy="60" r="22" fill="#e5393520" stroke="#e53935" stroke-width="2.5"/>
      <!-- Number badge 3 -->
      <circle cx="555" cy="140" r="11" fill="#e53935"/>
      <text x="555" y="144.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="white">3</text>
      <!-- Arrow -->
      <path d="M562 132 L602 82" stroke="#e53935" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>

      <defs>
        <marker id="arrowhead2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#e53935"/>
        </marker>
      </defs>
    </svg>
  </div>

</main>
</body>
</html>
